[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agi-converged"
version = "14.5.0"
description = "RC14.5 governed continual runtime with preregistered empirical learning and isolated neural-memory qualification"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "cryptography>=43", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
ml = ["torch>=2.5", "transformers>=4.53", "peft>=0.14", "trl>=0.15", "safetensors>=0.4", "faiss-cpu>=1.9"]
mac = ["mlx-lm>=0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "build>=1", "ruff>=0.8"]

[project.scripts]
egai = "minagi.cli:main"
egai-research = "egai.cli:main"
egai-fresh-task-authority = "minagi.rc14.fresh_task_daemon:main"

[tool.setuptools.packages.find]
where = ["src-python"]
include = ["kvcontinual*", "minagi*", "egai*"]

[tool.pytest.ini_options]
pythonpath = ["src-python", "tests-python/research"]
testpaths = ["tests-python"]
addopts = "--import-mode=importlib"
