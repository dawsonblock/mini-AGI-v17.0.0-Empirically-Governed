[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egai-kvcontinual-runtime"
version = "12.4.0"
description = "RC12.4 frozen-base forward-transfer qualification runtime with target-Mac execution qualification, hidden-task evaluation, and independent promotion"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "cryptography>=43",
]

[project.optional-dependencies]
security = ["cryptography>=43"]
ml = ["torch>=2.5", "transformers>=4.53", "peft>=0.14", "trl>=0.15", "safetensors>=0.4", "faiss-cpu>=1.9"]
mac = ["mlx-lm>=0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "ruff>=0.8", "cryptography>=43"]

[project.scripts]
egai = "egai.cli:main"
kvcontinual-execution = "kvcontinual.execution.cli:main"
kvcontinual-continual = "kvcontinual.continual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
