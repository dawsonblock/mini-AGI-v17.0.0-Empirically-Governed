[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvcontinual"
version = "0.10.25"
description = "RC10.24 macOS/Apple Silicon coherent hybrid execution memory + controlled continual-learning runtime"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
  "torch>=2.5",
  "transformers>=4.53",
  "peft>=0.14",
  "trl>=0.15",
  "safetensors>=0.4",
  "faiss-cpu>=1.9",
]
macos = [
  "torch>=2.5",
  "transformers>=4.53",
  "accelerate>=1.0",
  "safetensors>=0.4",
]
mlx = ["mlx>=0.20"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
