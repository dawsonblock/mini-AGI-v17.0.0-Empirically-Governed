[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-rsi-governed"
version = "1.0.0"
description = "Governed reference implementation inspired by Dream-RSI replay-based exploration research"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dream-rsi = "dream_rsi_governed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
